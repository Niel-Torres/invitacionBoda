<div class="separador fondo-1 bloqueAgradecimientos">
  <div class="bloqueAgradecimientos-subbloque">
    <div class="bloque-titulo">
      <h2 class="text-body-rosa" appTextTypewriter [delay]="100">{{thankYouText}}</h2>
    </div>
    <div class="icono bloque_image">
      <img src="assets/images/anillos/rings.gif" class="icono-img" width="400px" height="400px" appFadeInProgressive>
    </div>
    <div class="bloque-contandor">
      <!-- Countdown: Fecha boda -->
      <app-countdown-fecha [targetDate]="countdownDate"></app-countdown-fecha>
    </div>
  </div>
</div>
