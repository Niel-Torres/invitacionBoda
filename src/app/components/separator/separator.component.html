<!-- Separador que recibe un valor del componente padre-->
<div class="fondo-small"
     [style.background-image]="backgroundImage ? 'url(' + backgroundImage + ')' : null"
     [style.background-size]="backgroundImage ? 'cover' : null">
  <!-- Separador Simple: Frase -->
 
  <h2 *ngIf="isSeparadorSimple; else elseBlockSeparador2"  class="rosa fondo-small-text2">{{textoSeparador}}</h2>

  <!-- Separador Complejo: Frase + icono + SVG -->
  <ng-template #elseBlockSeparador2>
    <h2 class="black fondo-small-text1">
      {{ invitationData?.separators?.complexQuote }}
    </h2>
    <h2 class="black fondo-small-text1">
      {{ invitationData?.separators?.complexQuote2 }}
    </h2>
    <h2 class="black fondo-small-text1">
      {{ invitationData?.separators?.complexQuote3 }}
    </h2>
    
 
   

 
  </ng-template>
</div>
